name: FlightPulse Matrix v5.0 — 6-Shard Multi-GL Flight Scanner

on:
  workflow_dispatch:
    inputs:
      max_slots:
        description: 'Maximum due date_slots to scan across this shard'
        required: false
        default: '500'
        type: string
      force_all:
        description: 'Ignore check_interval_minutes and force scan active slots'
        required: false
        default: false
        type: boolean

concurrency:
  group: flight-tracker-scanner
  cancel-in-progress: false

jobs:
  scan-flight-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Patchright Browser Binaries
        id: cache-patchright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-patchright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-patchright-

      - name: Install Patchright Chrome & Xvfb Display Server
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgbm1 libasound2t64 || sudo apt-get install -y xvfb libgbm1
          patchright install chrome || patchright install chromium

      - name: Start Cloudflare WARP SOCKS5 Proxy (with Direct Fallback)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -y && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos mode proxy || true
          sudo warp-cli --accept-tos proxy port 40000 || true
          sudo warp-cli --accept-tos connect || true
          sleep 3
          ss -tlnp | grep 40000 || echo "WARP proxy not listening on 40000; runner will automatically fall back to direct connection."

      - name: Execute Shard ${{ matrix.shard }}/6 Multi-GL RAM-Buffered Scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCKS5_PROXY: socks5://127.0.0.1:40000
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          HEADLESS_MODE: 'false'
        run: |
          MAX_SLOTS="${{ inputs.max_slots || '500' }}"
          FORCE_FLAG=""
          if [ "${{ inputs.force_all }}" = "true" ]; then
            FORCE_FLAG="--force-all"
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -m src.runner --shard-index ${{ matrix.shard }} --total-shards 6 --max-slots $MAX_SLOTS $FORCE_FLAG
